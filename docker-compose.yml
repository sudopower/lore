services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: lore
      POSTGRES_PASSWORD: lore
      POSTGRES_DB: lore
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lore"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - lore-pg:/var/lib/postgresql/data

  lore:
    build: .
    environment:
      LORE_DATABASE_URL: postgres://lore:lore@db:5432/lore
      LORE_ADMIN_TOKEN: dev-admin
      LORE_EMBEDDER: hash
      LORE_LLM: fake
      LORE_DATA_DIR: /var/lib/lore
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - lore-data:/var/lib/lore

volumes:
  lore-pg:
  lore-data:
